<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin orders | Nirjas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gloock&family=Hanken+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shop.css">
<link rel="stylesheet" href="order.css">
<link rel="stylesheet" href="admin.css">
</head>
<body>

<header class="top">
  <a class="brand" href="shop.html">Nirjas</a>
  <span></span>
  <div class="acct">
    <a href="shop.html">View shop</a>
    <a href="my-orders.html">My orders</a>
  </div>
</header>

<main class="wrap admin-wrap">
  <h2>Orders</h2>
  <p class="admin-intro">Every order from every customer. Change a status and the customer sees it on their tracking page.</p>

  <section class="admin-stats" aria-label="Order summary">
    <div class="stat"><b id="stat-total">0</b><span>All orders</span></div>
    <div class="stat"><b id="stat-new">0</b><span>To ship</span></div>
    <div class="stat"><b id="stat-shipped">0</b><span>On the way</span></div>
    <div class="stat"><b id="stat-delivered">0</b><span>Delivered</span></div>
  </section>

  <div class="admin-bar">
    <input type="search" id="admin-search" placeholder="Search order number, name or phone" aria-label="Search orders">
    <div class="filters" id="admin-filters" role="group" aria-label="Filter by status">
      <button type="button" class="chip on" data-filter="all" aria-pressed="true">All</button>
      <button type="button" class="chip" data-filter="pending" aria-pressed="false">Pending</button>
      <button type="button" class="chip" data-filter="paid" aria-pressed="false">Paid</button>
      <button type="button" class="chip" data-filter="shipped" aria-pressed="false">Shipped</button>
      <button type="button" class="chip" data-filter="delivered" aria-pressed="false">Delivered</button>
      <button type="button" class="chip" data-filter="cancelled" aria-pressed="false">Cancelled</button>
    </div>
  </div>

  <p id="admin-state">Loading orders...</p>
  <div id="admin-orders"></div>
</main>

<script src="admin.js"></script>
</body>
</html>
