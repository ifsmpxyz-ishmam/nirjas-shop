<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in | Nirjas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gloock&family=Hanken+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shop.css">
<style>
.auth-box{max-width:460px;margin:40px auto 80px;padding:28px;background:var(--white);border:2px solid var(--ink);box-shadow:8px 8px 0 var(--ink)}
.auth-box h2{margin-bottom:6px}
.auth-sub{margin-bottom:20px;opacity:.8;font-size:15px}
.auth-form{display:flex;flex-direction:column;gap:12px}
.auth-form[hidden]{display:none}
.auth-form label{font-weight:700;font-size:14px}
.auth-form input{width:100%;font:inherit;padding:11px 12px;border:2px solid var(--ink);border-radius:0;background:var(--paper);color:var(--ink)}
.auth-form button[type="submit"]{width:100%;padding:14px;font-size:16px;margin-top:6px}
.auth-form button[type="submit"]:disabled{opacity:.6;cursor:not-allowed}
.hint{font-size:13px;opacity:.75;margin-top:-6px}
.msg{min-height:20px;font-weight:700;font-size:14px;color:#B5533C;line-height:1.4}
.switch{margin-top:18px;padding-top:16px;border-top:1px dashed var(--ink);font-size:15px;text-align:center}
.switch button{background:none;border:0;color:var(--ink);padding:0;font-weight:700;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.switch button:hover{background:none;color:#B5533C}
</style>
</head>
<body>

<header class="top">
  <a class="brand" href="shop.html">Nirjas</a>
  <span></span>
  <div class="acct">
    <a href="cart.html" class="cartlink" id="cart-count">Cart (0)</a>
  </div>
</header>

<main class="wrap">
  <div class="auth-box">

    <section id="login-view">
      <h2>Log in</h2>
      <p class="auth-sub">Welcome back. Log in to save your details for faster checkout.</p>
      <form id="login-form" class="auth-form" novalidate>
        <label for="login-email">Email</label>
        <input type="email" id="login-email" autocomplete="email" required>
        <label for="login-password">Password</label>
        <input type="password" id="login-password" autocomplete="current-password" required>
        <p class="msg" id="login-msg"></p>
        <button type="submit">Log in</button>
      </form>
      <p class="switch">New here? <button type="button" id="show-signup">Create an account</button></p>
    </section>

    <section id="signup-view" hidden>
      <h2>Create account</h2>
      <p class="auth-sub">It takes a minute. You can still order as a guest anytime.</p>
      <form id="signup-form" class="auth-form" novalidate>
        <label for="signup-name">Name</label>
        <input type="text" id="signup-name" autocomplete="name" required>
        <label for="signup-email">Email</label>
        <input type="email" id="signup-email" autocomplete="email" required>
        <label for="signup-password">Password</label>
        <input type="password" id="signup-password" autocomplete="new-password" required>
        <p class="hint">8 to 72 characters, with at least one letter and one number.</p>
        <p class="msg" id="signup-msg"></p>
        <button type="submit">Create account</button>
      </form>
      <p class="switch">Already have an account? <button type="button" id="show-login">Log in</button></p>
    </section>

  </div>
</main>


<script src="auth.js"></script>
<script src="login.js"></script>
</body>
</html>
